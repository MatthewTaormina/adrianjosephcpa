[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Google Ads PPC Campaign Target Routes
[[redirects]]
  from = "/go/corporate-tax"
  to = "/landing/corporate-tax.html"
  status = 200

[[redirects]]
  from = "/go/estate-trust"
  to = "/landing/estate-trust.html"
  status = 200

[[redirects]]
  from = "/go/business-succession"
  to = "/landing/business-succession.html"
  status = 200

[[redirects]]
  from = "/go/accounting"
  to = "/landing/compilation-accounting.html"
  status = 200

# Clean URLs & legacy website redirects
[[redirects]]
  from = "/taxation"
